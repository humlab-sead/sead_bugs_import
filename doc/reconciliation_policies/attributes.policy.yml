# BugsCEP → SEAD Reconciliation Policy
# Domain: TaxaMeasuredAttributes (TAttributes → tbl_taxa_measured_attributes)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    The row converter applies a three-step ordered search chain: full trace by
    compressToString(), a history-conflict guard for species-level edits after
    the last import, and then a value-based repository lookup. The updater also
    collapses some missing-value combinations into ignored-item errors. This
    importer does not persist child or supporting rows; species resolution is a
    lookup against previously imported taxonomy rows.
    Converted 2026-06-20: resolved resolve_taxon_id helper to structured resolver
    with trace lookup. Added known_divergences for species resolution being
    trace-based and missing-value collapse being adapter-only.

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: species_resolution_is_trace_based
    status: schema_limit
    description: The species taxon ID is resolved from the Bugs CODE value via a trace lookup against previously imported taxonomy rows. The actual trace helper and repository chain is adapter-only behavior.
    policy_choice: match_java_runtime
  - area: missing_value_collapse_adapter
    status: schema_limit
    description: The Java updater collapses some missing type/unit/value combinations into ignored-item errors. This data-quality check is adapter-only behavior not expressible in policy.
    policy_choice: match_java_runtime

# ── RESOLVERS ────────────────────────────────────────────────────────────────

resolvers:
  - name: resolve_taxon_id
    description: Resolve the Bugs species code to tbl_taxa_tree_master.taxon_id.
    returns: scalar
    args: ["source.CODE"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TTaxa
        identifier_expr: "source.CODE"
        return: return_entity
        comment: AttributesTraceSearch looks up the latest trace for the species CODE.
    used_by: [taxon_id]

policy:
  domain: attributes
  description: >
    Imports measured taxonomic attributes from TAttributes into
    tbl_taxa_measured_attributes. Matching is an ordered search chain: trace by
    the full attribute tuple first, then an external-edit guard, then a value
    lookup by type, measure, units, and species. If no match is found, a new
    measured-attribute row is created. No secondary persisted outputs are
    created during this import.

source:
  system: bugscep
  table: TAttributes
  sql: "SELECT CODE, AttribType, AttribMeasure, Value, AttribUnits FROM TAttributes"
  fields:
    - name: CODE
      type: decimal
      nullable: true
      role: natural_key
    - name: AttribType
      type: string
      nullable: true
      role: data
    - name: AttribMeasure
      type: string
      nullable: true
      role: data
    - name: Value
      type: float
      nullable: true
      role: data
    - name: AttribUnits
      type: string
      nullable: true
      role: data
  identity_key: CODE
  trace_key:
    template: "{{CODE},{AttribType},{AttribMeasure},{Value},{AttribUnits}}"
    comment: Order-1 trace lookup uses compressToString(), not getBugsIdentifier().

target:
  system: sead
  table: tbl_taxa_measured_attributes
  identity:
    column: measured_attribute_id
    type: integer
    strategy: sequence
    sequence: tbl_taxa_measured_attributes_measured_attribute_id_seq

mappings:
  - target_field: attribute_measure
    type: string
    nullable: true
    source_field: AttribMeasure
  - target_field: attribute_type
    type: string
    nullable: true
    source_field: AttribType
  - target_field: attribute_units
    type: string
    nullable: true
    source_field: AttribUnits
  - target_field: data
    type: decimal
    nullable: true
    transform:
      type: coerce
      input: "source.Value"
      output_type: decimal
  - target_field: taxon_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_taxon_id
      args: ["source.CODE"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: search_rule_chain
      order: 1
      type: search_chain
      description: Apply the ordered measured-attributes search strategies.
      steps:
        - name: trace_lookup
          order: 1
          type: trace_lookup
          description: Look up the existing measured-attribute row by the full compressed attribute tuple.
          bugs_table: TAttributes
          identifier_expr: "'{'+ (str(source.CODE) if source.CODE is not None else '') + ',' + str(source.AttribType) + ',' + str(source.AttribMeasure) + ',' + str(source.Value) + ',' + str(source.AttribUnits) + '}'"
          on_match: update
          on_error: skip
        - name: updated_since_last_import_guard
          order: 2
          type: history_check
          description: Return an error carrier if a measured attribute for the species was edited after the last import trace for this Bugs code.
          match_condition: "latest species-level trace exists for source.CODE and any attribute row for resolve_taxon_id(source.CODE) was edited after that trace"
          on_match: update
        - name: value_lookup
          order: 3
          type: database_query
          description: Find an existing measured-attribute row by type, measure, units, and species.
          table: tbl_taxa_measured_attributes
          where: "attribute_type = :attribute_type AND attribute_measure = :attribute_measure AND attribute_units = :attribute_units AND taxon_id = :taxon_id"
          bind:
            attribute_type: "source.AttribType"
            attribute_measure: "source.AttribMeasure"
            attribute_units: "source.AttribUnits"
            taxon_id: "resolve_taxon_id(source.CODE)"
          on_match: update
      on_no_match: fall_through
    - name: create_new
      order: 2
      type: create_new
      description: No search strategy matched; create a new measured-attribute row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - attribute_measure
    - attribute_type
    - attribute_units
    - data
    - taxon_id
  on_change: mark_updated
  comment: Java also collapses some missing type/unit/value combinations into ignored-item errors.

dependencies: [Index]

tracing:
  bugs_table: TAttributes
  sead_table: tbl_taxa_measured_attributes
  write_on: [insert, update]

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs species code to tbl_taxa_tree_master.taxon_id.
    signature: "resolve_taxon_id(code: float | None) -> int | None"
    used_by: []