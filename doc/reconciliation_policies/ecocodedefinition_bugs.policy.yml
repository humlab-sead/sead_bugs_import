# BugsCEP → SEAD Reconciliation Policy
# Domain: BugsDefinition (TEcoDefBugs → tbl_ecocode_definitions)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    Trace lookup is case-insensitive for the Bugs identifier. The updater always
    writes the fixed Bugs ecocode group rather than deriving it from row data.
    Converted to structured resolver and known_divergences on 2026-06-20.

policy:
  domain: ecocodedefinition_bugs
  description: >
    Imports Bugs ecocode definitions from TEcoDefBugs into
    tbl_ecocode_definitions. Matching is trace-first and case-insensitive by
    BugsEcoCODE; traced rows are updated in place and otherwise a new row is
    created.

source:
  system: bugscep
  table: TEcoDefBugs
  sql: "SELECT BugsEcoCODE, EcoLabel, Definition, Notes, SortOrder FROM TEcoDefBugs"
  fields:
    - name: BugsEcoCODE
      type: string
      nullable: true
      role: natural_key
    - name: EcoLabel
      type: string
      nullable: true
      role: data
    - name: Definition
      type: string
      nullable: true
      role: data
    - name: Notes
      type: string
      nullable: true
      role: data
    - name: SortOrder
      type: integer
      nullable: true
      role: ignored
      comment: Present in the Bugs row but not written to the SEAD ecocode definition.
  identity_key: BugsEcoCODE
  trace_key:
    template: "{{BugsEcoCODE},{Definition},{Notes},{EcoLabel},{SortOrder}}"

target:
  system: sead
  table: tbl_ecocode_definitions
  identity:
    column: ecocode_definition_id
    type: integer
    strategy: sequence
    sequence: tbl_ecocode_definitions_ecocode_definition_id_seq

mappings:
  - target_field: abbreviation
    type: string
    nullable: true
    source_field: BugsEcoCODE
  - target_field: definition
    type: string
    nullable: true
    source_field: Definition
  - target_field: name
    type: string
    nullable: true
    source_field: EcoLabel
  - target_field: notes
    type: string
    nullable: true
    source_field: Notes
  - target_field: ecocode_group_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_bugs_ecocode_group_id
      args: []

reconciliation:
  strategy: ordered_rules
  rules:
    - name: trace_lookup
      order: 1
      type: trace_lookup
      description: Look up the existing ecocode definition by BugsEcoCODE using the case-insensitive trace helper.
      bugs_table: TEcoDefBugs
      identifier_expr: "source.BugsEcoCODE"
      on_match: update
      on_error: skip
      comment: Uses IgnoreCaseBugsIdentifierWithSeadDataTable in the Java trace helper.
    - name: create_new
      order: 2
      type: create_new
      description: No trace match found; create a new Bugs ecocode definition row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - abbreviation
    - definition
    - name
    - notes
    - ecocode_group_id
  on_change: mark_updated

dependencies: [EcocodeGroup]

tracing:
  bugs_table: TEcoDefBugs
  sead_table: tbl_ecocode_definitions
  write_on: [insert, update]

resolvers:
  - name: resolve_bugs_ecocode_group_id
    description: >
      Return the fixed Bugs ecocode group row used by BugsDefinitionUpdater.
      Every Bugs definition is forced into the same group regardless of source data.
    returns: scalar
    args: []
    steps:
      - name: bugs_group_lookup
        action: database_query
        table: tbl_ecocode_groups
        where: "abbreviation = 'Bugs'"
        return: return_entity
    used_by: [ecocode_group_id]

helpers:
  - name: resolve_bugs_ecocode_group_id
    description: >
      Superseded by structured resolver resolve_bugs_ecocode_group_id.
      Previously returned the fixed Bugs ecocode group row.
    signature: "resolve_bugs_ecocode_group_id() -> int | None"
    used_by: []

known_divergences:
  - area: case_insensitive_trace_lookup
    status: behavior_ambiguous
    description: "The trace lookup uses IgnoreCaseBugsIdentifierWithSeadDataTable which performs case-insensitive matching on the BugsEcoCODE. This is a special accessor not used by most other policies."
    policy_choice: match_java_runtime
  - area: fixed_group_assignment
    status: schema_limit
    description: "The setGroup() method always fetches groupRepository.getBugsGroup() — a fixed query for the 'Bugs' group. This means every Bugs definition is forced into the same group, regardless of what the source data says."
    policy_choice: match_java_runtime
  - area: sort_order_field_ignored
    status: schema_limit
    description: "The SortOrder field is read from the Bugs table but never written to the SEAD model. It appears in the trace key template but not in any mapping."
    policy_choice: match_java_runtime
