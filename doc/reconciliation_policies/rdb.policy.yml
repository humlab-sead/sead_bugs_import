# BugsCEP → SEAD Reconciliation Policy
# Domain: Rdb (TRDB → tbl_rdb)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    The importer uses an ordered search chain: trace lookup by the compressed
    tuple, a history-conflict guard for externally edited species RDB rows, and
    then a repository lookup by traced code, country, and species.
    Converted 2026-06-20: resolved resolve_rdb_code_id, resolve_country_location_id,
    and resolve_taxon_id helpers to structured resolvers. Added known_divergences
    for history conflict detection and trace-based resolution being adapter-only.

policy:
  domain: rdb
  description: >
    Imports RDB assignments from TRDB into tbl_rdb. Existing traced rows are
    updated in place. If a species-linked RDB row was edited after the last
    import, the importer returns an error carrier. Otherwise it falls back to a
    value-based repository match before creating a new row.

source:
  system: bugscep
  table: TRDB
  sql: "SELECT CODE, CountryCode, RDBCode FROM TRDB"
  fields:
    - name: CODE
      type: decimal
      nullable: true
      role: natural_key
    - name: CountryCode
      type: string
      nullable: true
      role: data
    - name: RDBCode
      type: integer
      nullable: true
      role: data
  identity_key: CODE
  trace_key:
    template: "{{CODE},{CountryCode},{RDBCode}}"

target:
  system: sead
  table: tbl_rdb
  identity:
    column: rdb_id
    type: integer
    strategy: sequence
    sequence: tbl_rdb_rdb_id_seq

mappings:
  - target_field: rdb_code_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_rdb_code_id
      args: ["source.RDBCode"]
  - target_field: location_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_country_location_id
      args: ["source.CountryCode"]
  - target_field: taxon_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_taxon_id
      args: ["source.CODE"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: search_rule_chain
      order: 1
      type: search_chain
      description: Apply the ordered RDB search strategies.
      steps:
        - name: trace_lookup
          order: 1
          type: trace_lookup
          description: Check the last trace row using the compressed Bugs RDB tuple.
          bugs_table: TRDB
          identifier_expr: "'{'+ str(source.CODE) + ',' + str(source.CountryCode) + ',' + str(source.RDBCode) + '}'"
          on_match: update
          on_error: skip
        - name: updated_since_last_import_guard
          order: 2
          type: history_check
          description: Return an error carrier if any RDB row for the species was edited after the latest trace for this Bugs code.
          match_condition: "latest bugs_trace exists for source.CODE and any existing RDB row for resolve_taxon_id(source.CODE) was edited after that trace"
          on_match: update
          comment: Mirrors CheckTaxaRdbHistoryRule, whose error carrier is still passed through RdbUpdater.
        - name: repository_lookup
          order: 3
          type: database_query
          description: Find an existing RDB row by traced RDB code, species, and country.
          table: tbl_rdb
          where: "rdb_code_id = :rdb_code_id AND taxon_id = :taxon_id AND location_id = :location_id"
          bind:
            rdb_code_id: "resolve_rdb_code_id(source.RDBCode)"
            taxon_id: "resolve_taxon_id(source.CODE)"
            location_id: "resolve_country_location_id(source.CountryCode)"
          on_match: update
      on_no_match: fall_through
    - name: create_new
      order: 2
      type: create_new
      description: No search strategy matched; create a new RDB row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - rdb_code_id
    - location_id
    - taxon_id
  on_change: mark_updated

dependencies: [RdbCode]

tracing:
  bugs_table: TRDB
  sead_table: tbl_rdb
  write_on: [insert, update]

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: history_conflict_detection_adapter
    status: schema_limit
    description: The importer checks if any RDB row for the species was edited after the latest trace for this Bugs code. If so, an error carrier is returned. This history conflict detection (CheckTaxaRdbHistoryRule) is adapter-only behavior that compares trace timestamps with SEAD row modification times.
    policy_choice: match_java_runtime
  - area: trace_based_resolution_adapter
    status: schema_limit
    description: All three foreign keys (RDB code, country location, taxon) are resolved via trace lookups against previously imported rows. The actual trace helpers and repository chains are adapter-only behavior.
    policy_choice: match_java_runtime

# ── RESOLVERS ────────────────────────────────────────────────────────────────

resolvers:
  - name: resolve_rdb_code_id
    description: Resolve the traced RDB code imported from TRDBCodes to tbl_rdb_codes.rdb_code_id.
    returns: scalar
    args: ["source.RDBCode"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TRDBCodes
        identifier_expr: "source.RDBCode"
        return: return_entity
        comment: RdbCodeTraceSearch looks up the latest trace for the RDB code value.
    used_by: [rdb_code_id]
  - name: resolve_country_location_id
    description: Resolve the traced country row imported by CountryImporter to tbl_locations.location_id.
    returns: scalar
    args: ["source.CountryCode"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TCountry
        identifier_expr: "source.CountryCode"
        return: return_entity
        comment: CountryTraceSearch looks up the latest trace for the country code.
    used_by: [location_id]
  - name: resolve_taxon_id
    description: Resolve the Bugs species code to tbl_taxa_tree_master.taxon_id.
    returns: scalar
    args: ["source.CODE"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TTaxa
        identifier_expr: "source.CODE"
        return: return_entity
        comment: TaxaTraceSearch looks up the latest trace for the species code.
    used_by: [taxon_id]

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: resolve_rdb_code_id
    description: >
      Superseded by structured resolver resolve_rdb_code_id.
      Previously resolved the traced RDB code imported from TRDBCodes to
      tbl_rdb_codes.rdb_code_id.
    signature: "resolve_rdb_code_id(rdb_code: int | None) -> int | None"
    used_by: []
  - name: resolve_country_location_id
    description: >
      Superseded by structured resolver resolve_country_location_id.
      Previously resolved the traced country row imported by CountryImporter
      to tbl_locations.location_id.
    signature: "resolve_country_location_id(country_code: str | None) -> int | None"
    used_by: []
  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs species code to tbl_taxa_tree_master.taxon_id.
    signature: "resolve_taxon_id(code: float | None) -> int | None"
    used_by: []
