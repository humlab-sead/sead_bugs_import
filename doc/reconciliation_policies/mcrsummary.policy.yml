# BugsCEP → SEAD Reconciliation Policy
# Domain: MCRSummary (TMCRSummaryData → tbl_mcr_summary_data)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    This importer resolves a species from the Bugs CODE value, then looks up an
    existing summary row by taxon_id. If a row already exists it is returned
    unchanged; otherwise a new summary row is created.
    Converted 2026-06-20: resolved resolve_taxon_id helper to structured resolver
    with trace lookup. Added known_divergences for species resolution being
    trace-based and update detection being a no-op.

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: species_resolution_is_trace_based
    status: schema_limit
    description: The species taxon ID is resolved from the Bugs CODE value via a trace lookup against previously imported taxonomy rows. The actual trace helper and repository chain is adapter-only behavior.
    policy_choice: match_java_runtime
  - area: update_detection_is_no_op
    status: behavior_ambiguous
    description: "The importer has no update path — existing summary rows are returned unchanged (return_as_is). The policy documents this as strategy: never with on_change: ignore, but the Java runtime still creates new rows for species without existing summaries."
    policy_choice: match_java_runtime

# ── RESOLVERS ────────────────────────────────────────────────────────────────

resolvers:
  - name: resolve_taxon_id
    description: Resolve the Bugs CODE value to the SEAD species taxon_id used by tbl_mcr_summary_data.
    returns: scalar
    args: ["source.CODE"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TTaxa
        identifier_expr: "source.CODE"
        return: return_entity
        comment: MCRSummaryTraceSearch looks up the latest trace for the species CODE.
    used_by: [taxon_id]

policy:
  domain: mcrsummary
  description: >
    Imports MCR summary rows from TMCRSummaryData into tbl_mcr_summary_data.
    Reconciliation is species-key based rather than trace-based: the importer
    resolves the species from CODE and returns the existing summary row for that
    species if one already exists.

source:
  system: bugscep
  table: TMCRSummaryData
  sql: >
    SELECT CODE, TMaxLo, TMaxHi, TMinLo, TMinHi, TRangeLo, TRangeHi,
           COGMidTMax, COGMidTRange
    FROM TMCRSummaryData
  fields:
    - name: CODE
      type: decimal
      nullable: true
      role: natural_key
    - name: TMaxLo
      type: integer
      nullable: true
      role: data
    - name: TMaxHi
      type: integer
      nullable: true
      role: data
    - name: TMinLo
      type: integer
      nullable: true
      role: data
    - name: TMinHi
      type: integer
      nullable: true
      role: data
    - name: TRangeLo
      type: integer
      nullable: true
      role: data
    - name: TRangeHi
      type: integer
      nullable: true
      role: data
    - name: COGMidTMax
      type: integer
      nullable: true
      role: data
    - name: COGMidTRange
      type: integer
      nullable: true
      role: data
  identity_key: CODE
  trace_key:
    template: "{{CODE},{TMaxLo},{TMaxHi},{TMinLo},{TMinHi},{TRangeLo},{TRangeHi},{COGMidTMax},{COGMidTRange}}"

target:
  system: sead
  table: tbl_mcr_summary_data
  identity:
    column: mcr_summary_data_id
    type: integer
    strategy: sequence
    sequence: tbl_mcr_summary_data_mcr_summary_data_id_seq

mappings:
  - target_field: tmax_lo
    type: integer
    nullable: true
    source_field: TMaxLo
  - target_field: tmax_hi
    type: integer
    nullable: true
    source_field: TMaxHi
  - target_field: tmin_lo
    type: integer
    nullable: true
    source_field: TMinLo
  - target_field: tmin_hi
    type: integer
    nullable: true
    source_field: TMinHi
  - target_field: trange_lo
    type: integer
    nullable: true
    source_field: TRangeLo
  - target_field: trange_hi
    type: integer
    nullable: true
    source_field: TRangeHi
  - target_field: cog_mid_tmax
    type: integer
    nullable: true
    source_field: COGMidTMax
  - target_field: cog_mid_trange
    type: integer
    nullable: true
    source_field: COGMidTRange
  - target_field: taxon_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_taxon_id
      args: ["source.CODE"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: species_lookup
      order: 1
      type: database_query
      description: Find an existing summary row by the resolved species taxon_id.
      table: tbl_mcr_summary_data
      where: "taxon_id = :taxon_id"
      bind:
        taxon_id: "resolve_taxon_id(source.CODE)"
      on_match: return_as_is
    - name: create_new
      order: 2
      type: create_new
      description: No summary row exists for the resolved species; create a new one.
      on_match: insert

update_detection:
  strategy: never
  fields: []
  on_change: ignore
  comment: Existing summary rows are returned unchanged; MCRSummaryImporter has no update path.

dependencies: [Index]

tracing:
  bugs_table: TMCRSummaryData
  sead_table: tbl_mcr_summary_data
  write_on: [insert, update]

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs CODE value to the SEAD species taxon_id
      used by tbl_mcr_summary_data.
    signature: "resolve_taxon_id(code: float | None) -> int | None"
    used_by: []
