# BugsCEP → SEAD Reconciliation Policy
# Domain: Site (TSite → tbl_sites)
#
# Extracted from Java sources:
#   BugsSite.java, BugsSiteBugsTable.java
#   SeadSite.java (JPA entity)
#   BugsSiteTableConverter.java  (reconciliation logic)
#   SeadSiteCreator.java         (field mapping)
#   SiteUpdater.java             (update detection)
#   SiteRepository.java          (SEAD lookup queries)
#   SiteFromTrace.java / SiteFromCodeAllowDeletedSite.java  (trace lookup)
#   SiteLocationHandler.java, CountryLocationHandler.java, RegionLocationHandler.java
#
# Schema:               _schema.yml
# Codegen instructions: codegen_instructions/site.codegen.yml  (not yet created)
# ─────────────────────────────────────────────────────────────────────────────

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    Leaf importer — no dependencies on other domain importers.
    More complex than Bibliography: requires location resolution (Region and
    Country → tbl_locations / tbl_location_types) before the site row itself
    can be reconciled.  Updates are conditionally allowed via the
    allow.site.updates config flag (defaults to false).  The trace check also
    detects whether the SEAD row was externally edited after the last import
    and blocks re-import if so.
    Converted 2026-06-20: added known_divergences for external edit detection
    and float-to-decimal type conversion being adapter-only behavior.

policy:
  domain: site
  description: >
    Imports site records from the BugsCEP TSite table into tbl_sites.
    Before reconciling the site row itself the importer resolves Region
    and Country to Location rows in tbl_locations.  If the country cannot
    be resolved the row is rejected with an error.  Site lookup first
    checks the bugs_trace table; on a miss it falls back to a name+location
    join query.  A found site that was externally edited in SEAD since the
    last import is also rejected with an error rather than overwritten.

# ── SOURCE ───────────────────────────────────────────────────────────────────

source:
  system: bugscep
  table: TSite
  sql: >
    SELECT SiteCODE, SiteName, Region, Country, NGR,
           LatDD, LongDD, Alt, IDBy, Interp, Specimens
    FROM TSite

  fields:
    - name: SiteCODE
      type: string
      nullable: true
      role: natural_key
      comment: >
        Business key.  Used as bugs_identifier in bugs_trace and as the
        primary handle for all reconciliation lookups.

    - name: SiteName
      type: string
      nullable: true
      role: data
      comment: Required; a site without a name triggers an error.

    - name: Region
      type: string
      nullable: true
      role: data
      comment: >
        Resolved to a tbl_locations row (type = "Region") before site
        reconciliation.  Not written directly to tbl_sites.

    - name: Country
      type: string
      nullable: true
      role: data
      comment: >
        Resolved to a tbl_locations row (type = "Country") before site
        reconciliation.  A missing country record blocks the entire site row.
        Whether a missing country is auto-created is controlled by the
        allow.create.country config flag (default true).

    - name: NGR
      type: string
      nullable: true
      role: data
      comment: National Grid Reference; maps to national_site_identifier.

    - name: LatDD
      type: float
      nullable: true
      role: data
      comment: Decimal-degrees latitude; converted to BigDecimal for tbl_sites.

    - name: LongDD
      type: float
      nullable: true
      role: data
      comment: Decimal-degrees longitude; converted to BigDecimal for tbl_sites.

    - name: Alt
      type: float
      nullable: true
      role: data
      comment: Altitude in metres; converted to BigDecimal for tbl_sites.

    - name: IDBy
      type: string
      nullable: true
      role: ignored
      comment: >
        Identified-by field.  Read from Access but not written to tbl_sites
        (no column exists in the SEAD schema for it).

    - name: Interp
      type: string
      nullable: true
      role: data
      comment: Interpretation / description; maps to site_description.

    - name: Specimens
      type: string
      nullable: true
      role: ignored
      comment: >
        Specimen notes.  Read from Access but not written to tbl_sites
        (no column exists in the SEAD schema for it).

  trace_key:
    template: "{{{SiteCODE},{SiteName},{Region},{Country},{NGR},{LatDD},{LongDD},{Alt},{IDBy},{Interp},{Specimens}}}"
    comment: >
      Python .format()-style template.  {{ and }} are literal braces; the
      entire value is wrapped in curly braces to match the Java
      compressToString() output.  Python None renders as the string "None".

  identity_key: SiteCODE
  # returned by getBugsIdentifier() → getCode()

# ── TARGET ───────────────────────────────────────────────────────────────────

target:
  system: sead
  table: tbl_sites
  identity:
    column: site_id
    type: integer
    strategy: sequence
    sequence: tbl_sites_site_id_seq

# ── MAPPINGS ─────────────────────────────────────────────────────────────────
#
# Only fields written to tbl_sites are listed here.
# Region and Country drive location resolution (see reconciliation) but do
# not appear as tbl_sites columns.  IDBy and Specimens are ignored entirely.

mappings:
  - target_field: site_name
    type: string
    nullable: false
    source_field: SiteName
    comment: >
      Required.  SeadSiteCreator adds an error to the entity if SiteName is
      empty or null; the Persister will then record a bugs_error and skip the
      DB write.

  - target_field: national_site_identifier
    type: string
    nullable: true
    source_field: NGR

  - target_field: site_description
    type: string
    nullable: true
    source_field: Interp
    comment: >
      Windows line endings (\r\n) are normalised to \n in the equality
      check inside SeadSite.equals(), so the update-detection comparison
      must apply the same normalisation before deciding whether an update
      is needed.

  - target_field: latitude_dd
    type: decimal
    nullable: true
    transform:
      type: call
      helper: float_to_decimal
      args: ["source.LatDD"]
    comment: >
      Float → BigDecimal via BigDecimalDefinition.convertToSeadContext().
      A null source value maps to null; the update is suppressed if the
      new value is null (see update_detection notes below).

  - target_field: longitude_dd
    type: decimal
    nullable: true
    transform:
      type: call
      helper: float_to_decimal
      args: ["source.LongDD"]
    comment: Same null-suppression behaviour as latitude_dd.

  - target_field: altitude
    type: decimal
    nullable: true
    transform:
      type: call
      helper: float_to_decimal
      args: ["source.Alt"]
    comment: Same null-suppression behaviour as latitude_dd.

# ── RECONCILIATION ───────────────────────────────────────────────────────────
#
# Rules are tried in the order listed.  The first rule that produces a result
# wins; subsequent rules are not evaluated.
# The location resolution (Region + Country) is a prerequisite guard that
# runs before any of these rules.  A missing country causes an immediate
# error rather than continuing to rule 1.

reconciliation:
  strategy: ordered_rules

  prerequisite:
    name: resolve_locations
    description: >
      Resolve Region and Country to Location rows in tbl_locations before
      entering the rule chain.  If no Country location can be found or
      created, emit error "No country exists for site" and skip remaining
      rules.
    config:
      - name: allow_create_country
        property: allow.create.country
        default: true
        description: >
          When true, an unrecognised Country string creates a new tbl_locations
          row of type "Country".  When false, a missing country is always an
          error.

  rules:
    - name: trace_lookup
      order: 1
      type: trace_lookup
      description: >
        Look up the most recent bugs_trace row for this SiteCODE.  If found,
        fetch the tbl_sites row by its PK.  If the tbl_sites row was
        modified in SEAD after the trace timestamp (external edit), reject
        with error "Sead data has been updated since last bugs import" and
        return the (error-flagged) site unchanged.  If the trace row
        indicates a prior error (has_error = true), return the site unchanged
        without re-processing (on_error: skip).
      bugs_table: TSite
      identifier_expr: "source.SiteCODE"
      allow_deleted: false
      on_match: update
      on_error: skip
      external_edit:
        on_conflict: error
        message: "Sead data has been updated since last bugs import"

    - name: name_location_lookup
      order: 2
      type: database_query
      description: >
        Name + location join: if no new Location rows were just created
        during prerequisite resolution, use the precise name+locations query;
        otherwise fall back to name-only.
        Exactly 1 result → error "Site name exists for non-imported site" (not
        imported via bugs, so we refuse to claim it).
        More than 1 result → error "More than one site found by name and location".
        0 results → fall through to rule 3.
      variants:
        - name: name_and_locations
          condition: "not any_created_locations"
          query: >
            SELECT s.*
            FROM tbl_sites s
            JOIN tbl_site_locations sl ON sl.site_id = s.site_id
            WHERE s.site_name = :site_name
              AND sl.location_id = ANY(:location_ids)
            GROUP BY s.site_id
            HAVING COUNT(*) = :location_count
          bind:
            site_name: "source.SiteName"
            location_ids: "location_ids"
            location_count: "len(location_ids)"
        - name: name_only
          condition: "any_created_locations"
          query: >
            SELECT * FROM tbl_sites WHERE site_name = :site_name
          bind:
            site_name: "source.SiteName"
      result_handling:
        count_zero: fall_through
        count_one: error
        count_many: error

    - name: create_new
      order: 3
      type: create_new
      description: No existing record; allocate a new site_id and insert.
      on_match: insert

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: external_edit_detection_adapter
    status: schema_limit
    description: The trace lookup detects whether the SEAD row was externally edited after the last import by comparing the trace timestamp with the SEAD row's last modification time. If an external edit is detected, the row is rejected with error "Sead data has been updated since last bugs import". This timestamp comparison logic is adapter-only behavior.
    policy_choice: match_java_runtime
  - area: float_to_decimal_conversion_adapter
    status: behavior_ambiguous
    description: Latitude, longitude, and altitude values are converted from Java float to BigDecimal using BigDecimalDefinition.convertToSeadContext(). This type conversion is adapter-only behavior and not expressed as a structured resolver. The helper float_to_decimal documents this transformation but the actual rounding and scale behavior is implementation-specific.
    policy_choice: match_java_runtime

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: float_to_decimal
    description: >
      Converts a Java float value to BigDecimal using BigDecimalDefinition.convertToSeadContext().
      Used for latitude_dd, longitude_dd, and altitude fields.
      This is a type conversion, not a lookup resolver.
    signature: "float_to_decimal(value: float | None) -> decimal | None"
    used_by: [latitude_dd, longitude_dd, altitude]

# ── UPDATE DETECTION ─────────────────────────────────────────────────────────

update_detection:
  strategy: field_comparison
  fields:
    - national_site_identifier   # NGR
    - site_description           # Interp  — compare after \r\n → \n normalisation
    - latitude_dd                # LatDD   — BigDecimal numeric equality
    - longitude_dd               # LongDD  — BigDecimal numeric equality
    - altitude                   # Alt     — BigDecimal numeric equality
    - site_name                  # SiteName
  on_change: mark_updated

  comment: >
    BigDecimal fields use numeric equality (scale-insensitive), not
    Object.equals().  Null incoming values do NOT overwrite existing
    non-null values (null-suppression during doUpdates).
    Update writes are additionally gated by allow.site.updates (default
    false); if updates are detected but the flag is false, the row is
    rejected with error "Bugs data is updated but updates are disallowed."

  config:
    - name: allow_site_updates
      property: allow.site.updates
      default: false
      description: >
        Set to true to permit overwriting existing tbl_sites rows when
        BugsCEP data has changed since the last import.

# ── DEPENDENCIES ─────────────────────────────────────────────────────────────

dependencies: []
  # SiteImporter.super(dataMapper, persister) — no additional required importers.
  #
  # The Location / LocationType tables (tbl_locations, tbl_location_types) must
  # be pre-populated with at least the "Country" and "Region" type rows before
  # this importer runs, but that is schema-level setup, not an importer
  # dependency in the bugs_import sense.

# ── TRACING ──────────────────────────────────────────────────────────────────

tracing:
  bugs_table: TSite
  sead_table: tbl_sites
  write_on: [insert, update]
  comment: >
    A trace row is also read during reconciliation rule 1 (trace_lookup).
    The trace write on update only fires when allow.site.updates = true and
    a field difference was actually detected and applied.
