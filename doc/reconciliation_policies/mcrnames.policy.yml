# BugsCEP → SEAD Reconciliation Policy
# Domain: McrNames (TMCRNames → tbl_mcr_names)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    The row converter iterates two ordered MCRSearch strategies: trace lookup by
    Bugs identifier first, then repository lookup by the resolved species taxon
    ID. A new row is created only if neither strategy returns a match.
    Converted 2026-06-20: resolved resolve_taxon_id helper to structured resolver
    with trace lookup. Added known_divergences for species resolution being
    trace-based and tempCODE field being ignored.

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: species_resolution_is_trace_based
    status: schema_limit
    description: The species taxon ID is resolved from the Bugs CODE value via a trace lookup against previously imported taxonomy rows. The actual trace helper and repository chain is adapter-only behavior.
    policy_choice: match_java_runtime
  - area: tempcode_field_ignored
    status: schema_limit
    description: Source field tempCODE is read from TMCRNames but not written to tbl_mcr_names. The field is present in the source row but excluded from the mapping.
    policy_choice: match_java_runtime

# ── RESOLVERS ────────────────────────────────────────────────────────────────

resolvers:
  - name: resolve_taxon_id
    description: Resolve the Bugs CODE value to the SEAD species taxon_id used by tbl_mcr_names.
    returns: scalar
    args: ["source.CODE"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TTaxa
        identifier_expr: "source.CODE"
        return: return_entity
        comment: MCRNamesTraceSearch looks up the latest trace for the species CODE.
    used_by: [comparison_notes]

policy:
  domain: mcrnames
  description: >
    Imports MCR taxon-name rows from TMCRNames into tbl_mcr_names. Existing
    rows are found through an ordered MCRSearch chain rather than trace lookup.
    If no search strategy finds a row, the importer creates a new one.

source:
  system: bugscep
  table: TMCRNames
  sql: >
    SELECT CODE, CompareStatus, MCRName, MCRNameTrim, MCRNumber, tempCODE
    FROM TMCRNames
  fields:
    - name: CODE
      type: decimal
      nullable: true
      role: natural_key
    - name: CompareStatus
      type: string
      nullable: true
      role: data
    - name: MCRName
      type: string
      nullable: true
      role: data
    - name: MCRNameTrim
      type: string
      nullable: true
      role: data
    - name: MCRNumber
      type: integer
      nullable: true
      role: data
    - name: tempCODE
      type: decimal
      nullable: true
      role: ignored
      comment: Present in the source row but not written to tbl_mcr_names.
  identity_key: CODE
  trace_key:
    template: "{{CODE},{MCRNumber},{MCRName},{CompareStatus}}"
    comment: compressToString() uses CODE, MCRNumber, MCRName, and CompareStatus; getBugsIdentifier() uses CODE only.

target:
  system: sead
  table: tbl_mcr_names
  identity:
    column: taxon_id
    type: integer
    strategy: sequence
    sequence: tbl_mcr_names_taxon_id_seq

mappings:
  - target_field: comparison_notes
    type: string
    nullable: true
    source_field: CompareStatus
  - target_field: mcr_name_trim
    type: string
    nullable: true
    source_field: MCRNameTrim
  - target_field: mcr_number
    type: string
    nullable: true
    source_field: MCRNumber
  - target_field: mcr_species_name
    type: string
    nullable: true
    source_field: MCRName

reconciliation:
  strategy: ordered_rules
  rules:
    - name: search_rule_chain
      order: 1
      type: search_chain
      description: >
        Apply the ordered MCRSearch implementations and take the first match.
      steps:
        - name: trace_lookup
          order: 1
          type: trace_lookup
          description: Check the latest bugs_trace row using the Bugs identifier from CODE.
          bugs_table: TMCRNames
          identifier_expr: "source.CODE"
          on_match: update
          on_error: skip
        - name: species_value_lookup
          order: 2
          type: database_query
          description: Resolve the Bugs species by CODE, then look up tbl_mcr_names by taxon_id.
          table: tbl_mcr_names
          where: "taxon_id = :taxon_id"
          bind:
            taxon_id: "resolve_taxon_id(source.CODE)"
          on_match: update
      on_no_match: fall_through
    - name: create_new
      order: 2
      type: create_new
      description: No search rule matched; create a new MCR name row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - comparison_notes
    - mcr_name_trim
    - mcr_number
    - mcr_species_name
  on_change: mark_updated

dependencies: [Index]

tracing:
  bugs_table: TMCRNames
  sead_table: tbl_mcr_names
  write_on: [insert, update]
  comment: Both matched updates and inserts write new trace rows after persistence.

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs CODE value to the SEAD species taxon_id
      used by tbl_mcr_names.
    signature: "resolve_taxon_id(code: float | None) -> int | None"
    used_by: []
