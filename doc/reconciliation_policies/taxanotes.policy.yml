# BugsCEP → SEAD Reconciliation Policy
# Domain: TaxonomicNotes (TTaxaNotes → tbl_taxonomy_notes)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    This importer uses a custom repository lookup on note text, species, and
    reference rather than a trace helper.
    Converted 2026-06-20: resolved resolve_taxon_id and resolve_biblio_id helpers
    to structured resolvers with trace lookups. Added known_divergences for
    species and bibliography resolution being adapter-only.

policy:
  domain: taxanotes
  description: >
    Imports free-text taxonomy notes from TTaxaNotes into tbl_taxonomy_notes.
    Existing rows are found by the tuple of note text, species, and
    bibliography reference.

source:
  system: bugscep
  table: TTaxaNotes
  sql: "SELECT CODE, Ref, Data FROM TTaxaNotes"
  fields:
    - name: CODE
      type: string
      nullable: true
      role: natural_key
      comment: Species code used in the repository lookup tuple.
    - name: Ref
      type: string
      nullable: true
      role: data
    - name: Data
      type: string
      nullable: true
      role: data
  identity_key: CODE
  trace_key:
    template: "{{{CODE},{Ref},{Data}}}"

target:
  system: sead
  table: tbl_taxonomy_notes
  identity:
    column: taxonomy_notes_id
    type: integer
    strategy: sequence
    sequence: tbl_taxonomy_notes_taxonomy_notes_id_seq

mappings:
  - target_field: taxonomy_notes
    type: string
    nullable: true
    source_field: Data
  - target_field: taxon_id
    type: integer
    nullable: false
    transform:
      type: call
      helper: resolve_taxon_id
      args: ["source.CODE"]
  - target_field: biblio_id
    type: integer
    nullable: false
    transform:
      type: call
      helper: resolve_biblio_id
      args: ["source.Ref"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: taxonomy_note_lookup
      order: 1
      type: database_query
      description: Find an existing taxonomy-note row by note text, species, and reference.
      table: tbl_taxonomy_notes
      where: "taxonomy_notes = :taxonomy_notes AND taxon_id = :taxon_id AND biblio_id = :biblio_id"
      bind:
        taxonomy_notes: "source.Data"
        taxon_id: "resolve_taxon_id(source.CODE)"
        biblio_id: "resolve_biblio_id(source.Ref)"
      on_match: update
    - name: create_new
      order: 2
      type: create_new
      description: No tuple match found; create a new taxonomy-note row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - taxonomy_notes
    - taxon_id
    - biblio_id
  on_change: mark_updated

dependencies: [Bibliography, Index]

tracing:
  bugs_table: TTaxaNotes
  sead_table: tbl_taxonomy_notes
  write_on: [insert, update]

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: species_and_biblio_resolution_trace_based
    status: schema_limit
    description: Both species taxon ID and bibliography ID are resolved via trace lookups against previously imported rows. The actual trace helpers and repository chains are adapter-only behavior.
    policy_choice: match_java_runtime
  - area: taxonomy_notes_update_detection
    status: behavior_ambiguous
    description: The importer compares taxonomy_notes, taxon_id, and biblio_id fields to determine if an update is needed. If any field differs, the row is marked updated and re-persisted.
    policy_choice: match_java_runtime

# ── RESOLVERS ────────────────────────────────────────────────────────────────

resolvers:
  - name: resolve_taxon_id
    description: Resolve the Bugs species code to tbl_taxa_tree_master.taxon_id.
    returns: scalar
    args: ["source.CODE"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TTaxa
        identifier_expr: "source.CODE"
        return: return_entity
        comment: TaxaNotesTraceSearch looks up the latest trace for the species CODE.
    used_by: [taxon_id]
  - name: resolve_biblio_id
    description: Resolve the reference code to tbl_biblio.biblio_id.
    returns: scalar
    args: ["source.Ref"]
    steps:
      - name: database_query
        action: database_query
        table: tbl_biblio
        where: "bugs_reference ILIKE :reference"
        bind:
          reference: "source.Ref"
        return: return_entity
        comment: BiblioDataRepository.findBiblioByReference performs case-insensitive lookup on bugs_reference.
    used_by: [biblio_id]

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs species code to tbl_taxa_tree_master.taxon_id.
    signature: "resolve_taxon_id(code: str | None) -> int | None"
    used_by: []
  - name: resolve_biblio_id
    description: >
      Superseded by structured resolver resolve_biblio_id.
      Previously resolved the reference code to tbl_biblio.biblio_id.
    signature: "resolve_biblio_id(reference: str | None) -> int | None"
    used_by: []
