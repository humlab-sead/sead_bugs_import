# BugsCEP → SEAD Reconciliation Policy
# Domain: EcocodeGroup (TEcoDefGroups → tbl_ecocode_groups)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    Simple leaf importer with a trace-first reconciliation path. The trace
    helper is implemented as an inner class in the row converter.
    Converted to structured resolver and known_divergences on 2026-06-20.

policy:
  domain: ecocodegroup
  description: >
    Imports ecocode group definitions from TEcoDefGroups into
    tbl_ecocode_groups. Reconciliation is trace-first and falls through to
    create a new row when no prior import trace exists.

source:
  system: bugscep
  table: TEcoDefGroups
  sql: "SELECT EcoGroupCode, EcoName FROM TEcoDefGroups"
  fields:
    - name: EcoGroupCode
      type: string
      nullable: true
      role: natural_key
    - name: EcoName
      type: string
      nullable: true
      role: data
  identity_key: EcoGroupCode
  trace_key:
    template: "{{{EcoGroupCode},{EcoName}}}"

target:
  system: sead
  table: tbl_ecocode_groups
  identity:
    column: ecocode_group_id
    type: integer
    strategy: sequence
    sequence: tbl_ecocode_groups_ecocode_group_id_seq

mappings:
  - target_field: definition
    type: string
    nullable: true
    source_field: EcoName
  - target_field: name
    type: string
    nullable: true
    source_field: EcoName
  - target_field: abbreviation
    type: string
    nullable: true
    source_field: EcoGroupCode
  - target_field: ecocode_system_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_ecocode_system_id
      args: ["source.EcoGroupCode", "source.EcoName"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: trace_lookup
      order: 1
      type: trace_lookup
      description: Look up the ecocode group by its last bugs trace using EcoGroupCode.
      bugs_table: TEcoDefGroups
      identifier_expr: "source.EcoGroupCode"
      on_match: update
      on_error: skip
    - name: create_new
      order: 2
      type: create_new
      description: No trace match found; create a new ecocode group row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - definition
    - name
    - abbreviation
    - ecocode_system_id
  on_change: mark_updated

dependencies: []

tracing:
  bugs_table: TEcoDefGroups
  sead_table: tbl_ecocode_groups
  write_on: [insert, update]

resolvers:
  - name: resolve_ecocode_system_id
    description: >
      Resolve the Koch ecocode system row used by the ecocode-group importer.
      The Java updater only sets the system on new rows (lazy init), so existing
      rows imported before this logic will never receive a system assignment.
    returns: scalar
    args: []
    steps:
      - name: koch_system_lookup
        action: database_query
        table: tbl_ecocode_systems
        where: "name = 'Koch Ecology Codes'"
        return: return_entity
    used_by: [ecocode_system_id]

helpers:
  - name: resolve_ecocode_system_id
    description: >
      Superseded by structured resolver resolve_ecocode_system_id.
      Previously resolved the ecocode system row used by the ecocode-group importer.
    signature: "resolve_ecocode_system_id(group_code: str | None, group_name: str | None) -> int | None"
    used_by: []

known_divergences:
  - area: ecocode_system_id_lazy_init
    status: behavior_ambiguous
    description: "The Java updater only sets the Koch system on new rows (if original.getSystem() == null). Existing rows imported before this logic existed will never get a system assigned on update. This is a lazy-init pattern, not a reconciliation concern, but it means the ecocode_system_id mapping is not idempotent for pre-existing data."
    policy_choice: match_java_runtime
  - area: trace_helper_inner_class
    status: schema_limit
    description: "The trace helper (EcocodeGroupTraceHelper) is implemented as an inner static class in the row converter rather than as a standalone @Component. This is a structural choice in the Java code that limits how the helper can be reused by other converters."
    policy_choice: match_java_runtime
