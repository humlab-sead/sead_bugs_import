# BugsCEP → SEAD Reconciliation Policy
# Domain: KochDefinition (TEcoDefKoch → tbl_ecocode_definitions)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    Trace lookup is case-insensitive for the Bugs identifier. The updater maps
    the incoming Koch group abbreviation to a group row within the Koch system.
    Converted to structured resolver and known_divergences on 2026-06-20.

policy:
  domain: ecocodedefinition_koch
  description: >
    Imports Koch ecocode definitions from TEcoDefKoch into
    tbl_ecocode_definitions. Matching is trace-first and case-insensitive by
    BugsKochCode; traced rows are updated in place and otherwise a new row is
    created.

source:
  system: bugscep
  table: TEcoDefKoch
  sql: "SELECT BugsKochCode, KochCode, FullName, KochGroup, Description, Notes FROM TEcoDefKoch"
  fields:
    - name: BugsKochCode
      type: string
      nullable: true
      role: natural_key
    - name: KochCode
      type: string
      nullable: true
      role: ignored
      comment: Present in the row but not written directly; BugsKochCode becomes the SEAD abbreviation.
    - name: FullName
      type: string
      nullable: true
      role: data
    - name: KochGroup
      type: string
      nullable: true
      role: data
    - name: Description
      type: string
      nullable: true
      role: data
    - name: Notes
      type: string
      nullable: true
      role: data
  identity_key: BugsKochCode
  trace_key:
    template: "{{BugsKochCode},{KochCode},{FullName},{KochGroup},{Description},{Notes}}"

target:
  system: sead
  table: tbl_ecocode_definitions
  identity:
    column: ecocode_definition_id
    type: integer
    strategy: sequence
    sequence: tbl_ecocode_definitions_ecocode_definition_id_seq

mappings:
  - target_field: abbreviation
    type: string
    nullable: true
    source_field: BugsKochCode
  - target_field: definition
    type: string
    nullable: true
    source_field: Description
  - target_field: name
    type: string
    nullable: true
    source_field: FullName
  - target_field: notes
    type: string
    nullable: true
    source_field: Notes
  - target_field: ecocode_group_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_koch_ecocode_group_id
      args: ["source.KochGroup"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: trace_lookup
      order: 1
      type: trace_lookup
      description: Look up the existing ecocode definition by BugsKochCode using the case-insensitive trace helper.
      bugs_table: TEcoDefKoch
      identifier_expr: "source.BugsKochCode"
      on_match: update
      on_error: skip
      comment: Uses IgnoreCaseBugsIdentifierWithSeadDataTable in the Java trace helper.
    - name: create_new
      order: 2
      type: create_new
      description: No trace match found; create a new Koch ecocode definition row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - abbreviation
    - definition
    - name
    - notes
    - ecocode_group_id
  on_change: mark_updated

dependencies: [EcocodeGroup]

tracing:
  bugs_table: TEcoDefKoch
  sead_table: tbl_ecocode_definitions
  write_on: [insert, update]

resolvers:
  - name: resolve_koch_ecocode_group_id
    description: >
      Resolve the Koch group abbreviation within the Koch ecocode system to
      tbl_ecocode_groups.ecocode_group_id. Two-step: get Koch system, then
      find group by abbreviation. Adds error if group not found.
    returns: scalar
    args: [koch_group]
    steps:
      - name: koch_system_lookup
        action: database_query
        table: tbl_ecocode_systems
        where: "name = 'Koch Ecology Codes'"
        return: return_entity
      - name: group_by_abbreviation
        action: database_query
        table: tbl_ecocode_groups
        where: "ecocode_system_id = :system_id AND abbreviation = :koch_group"
        bind:
          system_id: "related.resolve_koch_ecocode_group_id.koch_system_lookup"
          koch_group: "koch_group"
        return: return_entity
      - name: group_not_found
        action: emit_issue
        emit:
          severity: error
          code: koch_group_not_found
          message: "Koch group not found for abbreviation: {koch_group}"
        return: empty_entity
    used_by: [ecocode_group_id]

helpers:
  - name: resolve_koch_ecocode_group_id
    description: >
      Superseded by structured resolver resolve_koch_ecocode_group_id.
      Previously resolved the Koch group abbreviation within the Koch ecocode system.
    signature: "resolve_koch_ecocode_group_id(koch_group: str | None) -> int | None"
    used_by: []

known_divergences:
  - area: case_insensitive_trace_lookup
    status: behavior_ambiguous
    description: "The trace lookup uses IgnoreCaseBugsIdentifierWithSeadDataTable which performs case-insensitive matching on the BugsKochCode. This is a special accessor not used by most other policies."
    policy_choice: match_java_runtime
  - area: two_hop_group_resolution
    status: schema_limit
    description: "The Koch group resolution is a two-hop lookup: first get the Koch EcocodeSystem (via KochSystemManager which caches the result), then find the group by abbreviation within that system. If the group isn't found, it adds an error rather than creating one."
    policy_choice: match_java_runtime
  - area: koch_code_field_ignored
    status: schema_limit
    description: "The KochCode field is read from the source but never written to SEAD. Only BugsKochCode becomes the abbreviation in the target model."
    policy_choice: match_java_runtime
