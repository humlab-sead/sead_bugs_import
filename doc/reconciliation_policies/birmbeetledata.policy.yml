# BugsCEP → SEAD Reconciliation Policy
# Domain: BirmBeetleData (TbirmBEETLEdat → tbl_mcrdata_birmbeetledat)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    This importer resolves a species from CODE, then looks up an existing row
    by the composite key of taxon_id plus MCRRow. The mcr_data value is built
    by concatenating the ordered Field1..Field60 values. No trace helper exists
    for this policy — reconciliation uses a custom repository lookup.
    Converted to structured resolvers and known_divergences on 2026-06-20.

policy:
  domain: birmbeetledata
  description: >
    Imports Birmingham beetle MCR rows from TbirmBEETLEdat into
    tbl_mcrdata_birmbeetledat. Reconciliation is a composite-key lookup on the
    resolved species taxon_id and the row number; existing rows are returned
    unchanged and missing rows are created.

