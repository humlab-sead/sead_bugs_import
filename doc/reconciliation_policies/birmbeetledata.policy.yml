  trace_key:
    template: "{{CODE},{MCRRow},{Field1..Field60 concatenated in order}}"
    comment: compressToString() concatenates all Field1..Field60 values without separators between CODE and MCRRow.

target:
  system: sead
  table: tbl_mcrdata_birmbeetledat
  identity:
    column: mcrdata_birmbeetledat_id
    type: integer
    strategy: sequence
    sequence: tbl_mcrdata_birmbeetledat_mcrdata_birmbeetledat_id_seq

mappings:
  - target_field: mcr_data
    type: string
    nullable: true
    transform:
      type: call
      helper: build_birm_mcr_data
      args: ["source"]
  - target_field: mcr_row
    type: integer
    nullable: false
    source_field: MCRRow
  - target_field: taxon_id
    type: integer
    nullable: false
    transform:
      type: call
      helper: resolve_taxon_id
      args: ["source.CODE"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: composite_lookup
      order: 1
      type: database_query
      description: Find an existing Birmingham beetle row by taxon_id plus MCRRow.
      table: tbl_mcrdata_birmbeetledat
      where: "taxon_id = :taxon_id AND mcr_row = :mcr_row"
      bind:
        taxon_id: "resolve_taxon_id(source.CODE)"
        mcr_row: "source.MCRRow"
      on_match: return_as_is
    - name: create_new
      order: 2
      type: create_new
      description: No composite-key match found; create a new Birmingham beetle row.
      on_match: insert

update_detection:
  strategy: never
  fields: []
  on_change: ignore
  comment: Existing rows are returned unchanged; BirmBeetleDataImporter has no update path.

dependencies: [Index]

tracing:
  bugs_table: TbirmBEETLEdat
  sead_table: tbl_mcrdata_birmbeetledat
  write_on: [insert, update]

resolvers:
  - name: resolve_taxon_id
    description: >
      Resolve the Bugs species code to tbl_taxa_tree_master.taxon_id.
      Converts the decimal CODE to a BigDecimal before lookup.
    returns: scalar
    args: [code]
    steps:
      - name: species_lookup
        action: database_query
        table: tbl_taxa_tree_master
        where: "bugs_code = :bugs_code"
        bind:
          bugs_code: "BigDecimalDefinition.convertToSeadCode(code)"
        return: return_entity
    used_by: [taxon_id]

helpers:
  - name: build_birm_mcr_data
    description: >
      No structured resolver available. This is a field transformation (concatenates Field1..Field60) not a database lookup.
      The buildBirmMcrData() method uses a StringBuilder to join non-empty field values with spaces.
    signature: "build_birm_mcr_data(source_row: object) -> str"
    used_by: [mcr_data]

  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs species code to taxon_id.
    signature: "resolve_taxon_id(code: float | None) -> int | None"
    used_by: []

known_divergences:
  - area: no_trace_helper
    status: schema_limit
    description: "This policy has no trace helper. Reconciliation uses a custom repository method findByTaxonIdAndMcrRow() which performs a composite-key lookup on (taxon_id, mcr_row). This is different from the trace-first pattern used by most other policies."
    policy_choice: match_java_runtime
  - area: lossy_field_concatenation
    status: behavior_ambiguous
    description: "The buildBirmMcrData() method concatenates Field1..Field60 values using a StringBuilder, skipping null or empty values. This is a lossy operation — the original field boundaries are not preserved in the output string. Reconstructing individual fields from the concatenated string is not possible."
    policy_choice: match_java_runtime
  - area: composite_key_lookup
    status: schema_limit
    description: "The reconciliation lookup uses two fields (taxon_id and MCRRow) as a composite key. This is unusual — most policies use a single natural key or trace-based lookup."
    policy_choice: match_java_runtime
