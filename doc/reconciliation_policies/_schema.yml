#    phase: after_row_mapping_before_persist
#    mode: pair_merge
#    description: <string>
#    group_by: [<expr>, ...]
#    partition_by: [<expr>, ...]
#    pair_rules:
#      left: <expr>
#      right: <expr>
#      include_singletons: true|false
#    retain_row: left_when_present_else_right
#    actions:
#      - type: use_pair_range_relative_age|normalize_pair_uncertainty|copy_if_empty
#        target: <target_field>
#        from_paired_field: <target_field>
#        clear_when_closed_range: true|false
#        convert_ca_pair_to_standard: true|false
#        comment: <string>
#    on_conflict: <emit>
#    comment: <string>

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────
# Optional records of deliberate policy-versus-Java differences or places where
# the current Java behavior is likely wrong or ambiguous.
known_divergences: []
#  - area: <string>
#    status: java_bug_suspected|behavior_ambiguous|schema_limit
#    description: <string>
#    policy_choice: match_java_runtime|match_intended_behavior|defer_exact_parity

# ── RESOLVERS ────────────────────────────────────────────────────────────────
# Named ordered lookup or fallback definitions referenced by transform.call.
# Prefer resolvers when the Java helper does more than one simple lookup or
# when it emits specific fallback outcomes.
resolvers: []
#  - name: <string>
#    description: <string>
#    returns: scalar|entity_ref|list
#    args: [<arg_name>, ...]
#    config:
#      - name: <string>
#        property: <string>
#        default: <literal>
#        description: <string>
#    steps:
#      - name: <string>
#        when: <expr>
#        action: trace_lookup|database_query|emit_issue
#        bugs_table: <string>
#        identifier_expr: <expr>
#        table: <string>
#        where: <sql_fragment>
#        query: <sql_string>
#        bind:
#          <name>: <expr>
#        emit: <emit>
#        return: continue|return_entity|return_value|empty_entity|none
#        comment: <string>
#    used_by: [<target_field>, ...]
#    comment: <string>

# ── HELPERS ──────────────────────────────────────────────────────────────────
# Named helper functions referenced in transform.call.
# Use helpers for simple reusable computations. Use resolvers for ordered
# lookup or fallback behavior.
helpers: []
#  - name: <string>
#    description: <string>
#    signature: <string>        # Python type annotation hint
#    expression: <string>       # optional implementation sketch
#    used_by: [<target_field>, ...]
