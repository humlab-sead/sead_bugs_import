      related_outputs: [dataset]
      row_changed: true
      graph_result:
        dataset:
          dataset_id: null
          supporting_action: create
          dataset_name: PERIOD_DATASET_1
          data_type_id: 41
          method_abbreviation: RelativeCal
          master_set_id: 51
