fixture_version: "1.0"
policy: datesperiod
scenarios:
  - name: blank_method_uses_unknown_default
    intent: resolver_path
    source_rows:
      - PeriodDateCODE: PERIOD_1
        SampleCODE: SAMPLE_20
        Uncertainty: ""
        PeriodCODE: PERIOD-CAL-1
        DatingMethod: ""
        Notes: blank method
    policy_context:
      args:
        dating_method: ""
        period_years_type: Calendar
      step_hits:
        empty_default: true
    expects:
      resolver: resolve_relative_date_method
      resolver_path: [empty_default]
      target_field: analysis_entity_id
      resolver_result:
        result_kind: return_entity
        source: empty_default
        method_abbreviation: UnknownCal
  - name: direct_method_lookup_uses_abbreviation
