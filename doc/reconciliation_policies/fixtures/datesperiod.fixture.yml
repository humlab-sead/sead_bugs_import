        Uncertainty: sigma
        PeriodCODE: PERIOD-CAL-3
        DatingMethod: Relative
        Notes: computed method
    policy_context:
      args:
        dating_method: Relative
        period_years_type: Calendar
      step_hits:
        direct_lookup: false
        computed_from_period_year_type: true
    expects:
      resolver: resolve_relative_date_method
      resolver_path: [direct_lookup, computed_from_period_year_type]
      target_field: analysis_entity_id
      resolver_result:
        result_kind: return_entity
