        Uncertainty: sigma
        PeriodCODE: PERIOD-CAL-4
        DatingMethod: MissingMethod
        Notes: unresolved method
    policy_context:
      args:
        dating_method: MissingMethod
        period_years_type: Calendar
      step_hits:
        direct_lookup: false
        computed_from_period_year_type: false
    expects:
      resolver: resolve_relative_date_method
      resolver_path: [direct_lookup, computed_from_period_year_type, not_found]
      target_field: analysis_entity_id
      resolver_result:
        result_kind: empty_entity
        source: not_found
        issue:
          severity: error
          code: relative_date_method_not_found
          message: No dating method found
      emit_codes: [relative_date_method_not_found]
