        Uncertainty: sigma
        PeriodCODE: PERIOD-CAL-2
        DatingMethod: DirectMethod
        Notes: direct method
    policy_context:
      args:
        dating_method: DirectMethod
        period_years_type: Calendar
      step_hits:
        direct_lookup: true
    expects:
      resolver: resolve_relative_date_method
      resolver_path: [direct_lookup]
      target_field: analysis_entity_id
      resolver_result:
        result_kind: return_entity
        source: direct_lookup
        method_abbreviation: DirectMethod
  - name: computed_method_uses_period_year_type_suffix
