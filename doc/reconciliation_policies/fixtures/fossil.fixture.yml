fixture_version: "1.0"
policy: fossil
scenarios:
  - name: clone_fossil_dataset_when_updates_disabled
    intent: supporting_output_result
    source_rows:
      - FossilBugsCODE: FOSSIL_SD_1
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_SD_1
        Abundance: 4
    policy_context:
      args:
        output_name: dataset
      step_hits: {}
      state:
        allow_dataset_updates: false
    expects:
      related_outputs: [dataset]
      row_changed: true
      graph_result:
        dataset:
          dataset_id: null
          updated_dataset_id: 20
          supporting_action: create
  - name: reuse_existing_fossil_dataset_when_updates_enabled
    intent: supporting_output_result
    source_rows:
      - FossilBugsCODE: FOSSIL_SD_2
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_SD_2
        Abundance: 7
    policy_context:
      args:
        output_name: dataset
      step_hits: {}
      state:
        allow_dataset_updates: true
    expects:
      related_outputs: [dataset]
      row_changed: false
      graph_result:
        dataset:
          dataset_id: 20
          updated_dataset_id: null
          supporting_action: reuse
  - name: create_fossil_analysis_entity_when_missing
    intent: supporting_output_result
    source_rows:
      - FossilBugsCODE: FOSSIL_SA_1
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_SA_1
        Abundance: 9
    policy_context:
      args:
        output_name: analysis_entity
      step_hits: {}
      state:
        allow_dataset_updates: true
    expects:
      related_outputs: [analysis_entity]
      row_changed: true
      graph_result:
        analysis_entity:
          supporting_action: create
          physical_sample_id: 10
          dataset_id: 20
  - name: reuse_existing_fossil_analysis_entity_when_present
    intent: supporting_output_result
    source_rows:
      - FossilBugsCODE: FOSSIL_SA_2
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_SA_2
        Abundance: 9
    policy_context:
      args:
        output_name: analysis_entity
      step_hits: {}
      state:
        allow_dataset_updates: true
        existing_analysis_entity_id: 30
    expects:
      related_outputs: [analysis_entity]
      row_changed: false
      graph_result:
        analysis_entity:
          analysis_entity_id: 30
          supporting_action: reuse
          physical_sample_id: 10
          dataset_id: 20
  - name: clone_dataset_when_updates_disabled
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_1
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_1
        Abundance: 4
    policy_context:
      config:
        allow_dataset_updates: false
    expects:
      related_outputs: [dataset, analysis_entity]
      updates_target_fields: [analysis_entity_id]
      row_changed: true
      dataset_link_mode: clone_updated_dataset
      graph_result:
        dataset:
          dataset_id: null
          updated_dataset_id: 20
          supporting_action: create
        analysis_entity:
          supporting_action: create
          physical_sample_id: 10
          dataset_id: null
      comment: Existing datasets should be cloned through updated_dataset when dataset updates are disabled and abundance data changed.
  - name: reuse_dataset_when_updates_enabled
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_2
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_2
        Abundance: 7
    policy_context:
      config:
        allow_dataset_updates: true
    expects:
      related_outputs: [dataset, analysis_entity]
      updates_target_fields: [analysis_entity_id]
      row_changed: true
      dataset_link_mode: reuse_existing_dataset
      graph_result:
        dataset:
          dataset_id: 20
          updated_dataset_id: null
          supporting_action: reuse
        analysis_entity:
          supporting_action: create
          physical_sample_id: 10
          dataset_id: 20
      comment: Existing datasets should be reused directly when dataset updates are enabled.
  - name: reuse_existing_analysis_entity_when_present
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_3
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_3
        Abundance: 9
    policy_context:
      config:
        allow_dataset_updates: true
      state:
        existing_analysis_entity_id: 30
    expects:
      related_outputs: [dataset, analysis_entity]
      updates_target_fields: [analysis_entity_id]
      row_changed: true
      dataset_link_mode: reuse_existing_dataset
      graph_result:
        dataset:
          dataset_id: 20
          updated_dataset_id: null
          supporting_action: reuse
        analysis_entity:
          analysis_entity_id: 30
          supporting_action: reuse
          physical_sample_id: 10
          dataset_id: 20
      comment: Existing analysis entities should be reused when the sample and dataset already match a stored row.
  - name: missing_sample_trace_emits_graph_issue
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_4
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_4
        Abundance: 2
    policy_context:
      config:
        allow_dataset_updates: true
      state:
        sample_found: false
    expects:
      related_outputs: [dataset, analysis_entity]
      row_changed: false
      graph_issue:
        severity: error
        message: No sample found for code
      comment: Missing sample traces should stop graph creation and report the same error on the abundance row.
  - name: duplicate_analysis_entities_emit_graph_issue
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_5
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_5
        Abundance: 3
    policy_context:
      config:
        allow_dataset_updates: true
      state:
        matching_analysis_entity_count: 2
    expects:
      related_outputs: [dataset, analysis_entity]
      dataset_link_mode: reuse_existing_dataset
      row_changed: false
      graph_issue:
        severity: error
        message: More than one analysis entity found for same dataset and sample
      comment: Duplicate analysis entities for the same sample and dataset should stop graph creation and report the current Java error.
  - name: missing_sample_code_emits_graph_issue
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_6
        CODE: 12
        SampleCODE: ""
        Abundance: 5
    policy_context:
      config:
        allow_dataset_updates: true
    expects:
      related_outputs: [dataset, analysis_entity]
      row_changed: true
      graph_issue:
        severity: error
        message: No sample specified
      comment: Blank sample codes should stop before trace lookup, emit the current Java error, and still return a changed result from AnalysisEntityManager.
  - name: analysis_entity_references_dataset_via_related_expression
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_EXPR_1
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_EXPR_1
        Abundance: 6
    policy_context:
      config:
        allow_dataset_updates: true
      state:
        resolved_dataset_id: 40
    expects:
      related_outputs: [dataset, analysis_entity]
      updates_target_fields: [analysis_entity_id]
      row_changed: true
      graph_result:
        dataset:
          dataset_id: 40
          updated_dataset_id: null
          supporting_action: reuse
        analysis_entity:
          analysis_entity_id: 50
          supporting_action: create
          physical_sample_id: 10
          dataset_id: 40
      comment: >
        Validates that the related.<name>.<field> expression resolves
        correctly: dataset is evaluated first (phase: before_parent),
        its dataset_id is referenced by analysis_entity via
        related.dataset.dataset_id, and the parent abundance row
        references analysis_entity_id via
        related.analysis_entity.analysis_entity_id.  This replaces
        the resolve_fossil_analysis_entity_id helper call.
  - name: analysis_entity_dataset_id_null_when_dataset_missing
    intent: related_output_graph
    source_rows:
      - FossilBugsCODE: FOSSIL_EXPR_2
        CODE: 12
        SampleCODE: SAMPLE_FOSSIL_EXPR_2
        Abundance: 8
    policy_context:
      config:
        allow_dataset_updates: true
      state:
        sample_found: false
    expects:
      related_outputs: [dataset, analysis_entity]
      updates_target_fields: [analysis_entity_id]
      row_changed: false
      graph_issue:
        severity: error
        message: No sample found for code
      comment: >
        Validates that a null dataset_id propagates through the
        related-output chain: analysis_entity cannot be created
        without dataset_id, and the parent mapping receives null
        for analysis_entity_id.  Confirms the expression language
        handles null propagation correctly.