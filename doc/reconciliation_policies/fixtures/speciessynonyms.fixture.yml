      - CODE: 10010050
        SynGenus: Calosoma
        SynSpecies: inquisitor
        SynAuthority: Linnaeus
        Ref: Ref-402
        Notes: New synonym notes
    policy_context:
      step_hits:
        trace_lookup: false
    expects:
      reconciliation_path: [trace_lookup, create_new]
      reconciliation_result:
        result_kind: insert_new
        persisted_action: create
        source: create_new
        row_id: null
        species_code: 10010050
        synonym_genus: Calosoma
        synonym_species: inquisitor
        synonym_authority: Linnaeus
        bugs_reference: Ref-402