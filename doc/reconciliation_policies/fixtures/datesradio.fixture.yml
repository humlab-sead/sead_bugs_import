fixture_version: "1.0"
policy: datesradio
scenarios:
  - name: blank_lab_id_uses_unknown_shortcut
    intent: resolver_path
    source_rows:
      - DateCODE: RAD_1
        SampleCODE: SAMPLE_10
        LabNr: LAB-1
        Uncertainty: ""
        Date: 4250
        AgeErrorOrPlusError: 45
        AgeErrorMinus: 45
        DatingMethod: Radiocarbon
        MaterialType: charcoal
        LabID: ""
        Notes: blank lab id
    policy_context:
      args:
        lab_id: ""
      step_hits:
        unknown_shortcut: true
    expects:
      resolver: resolve_dating_lab_id
      resolver_path: [unknown_shortcut]
      target_field: dating_lab_id
      resolver_result:
        result_kind: return_entity
        source: unknown_shortcut
        lab_id: Unknown
      related_outputs: [dataset, analysis_entity]
      known_divergence_areas: [update_detection.age]
