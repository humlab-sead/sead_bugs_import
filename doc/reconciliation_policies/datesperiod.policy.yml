# BugsCEP → SEAD Reconciliation Policy
# Domain: DatesPeriod (TDatesPeriod → tbl_relative_dates)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    The updater resolves the sample, dating uncertainty, relative age, and the
    analysis-entity dataset in one pass. Dataset creation uses the Bugs master
    set, the fixed "Uncalibrated dates" data type, and the dating method
    derived from RelativeDateMethodManager. The importer does not create
    relative ages locally; it links to the traced Period relative age and only
    persists the RelativeDate plus its cascaded dataset and analysis entity.

policy:
  domain: datesperiod
  description: >
    Imports period-based relative dates from TDatesPeriod into
    tbl_relative_dates. Matching is trace-first by PeriodDateCODE. Traced rows
    are updated in place; otherwise a new relative-date row is created.
    Supporting dataset and analysis-entity rows are created or updated as part
    of the persisted RelativeDate graph, while `relative_age_id` comes from the
    traced Period dependency.

source:
  system: bugscep
  table: TDatesPeriod
  sql: "SELECT PeriodDateCODE, SampleCODE, Uncertainty, PeriodCODE, DatingMethod, Notes FROM TDatesPeriod"
  fields:
    - name: PeriodDateCODE
      type: string
      nullable: true
      role: natural_key
    - name: SampleCODE
      type: string
      nullable: true
      role: data
    - name: Uncertainty
      type: string
      nullable: true
      role: data
    - name: PeriodCODE
      type: string
      nullable: true
      role: data
    - name: DatingMethod
      type: string
      nullable: true
      role: data
    - name: Notes
      type: string
      nullable: true
      role: data
  identity_key: PeriodDateCODE
  trace_key:
    template: "{{PeriodDateCODE},{SampleCODE},{Uncertainty},{PeriodCODE},{DatingMethod},{Notes}}"

target:
  system: sead
  table: tbl_relative_dates
  identity:
    column: relative_date_id
    type: integer
    strategy: sequence
    sequence: tbl_relative_dates_relative_date_id_seq

related_outputs:
  - name: dataset
    table: tbl_datasets
    mode: zero_or_one
    relationship: supporting
    item_helper: generate_period_dataset_items
    persistence: cascade
    key_fields: [dataset_id, dataset_name, data_type_id, method_id, master_set_id]
    identity:
      column: dataset_id
      type: integer
      strategy: sequence
      sequence: tbl_datasets_dataset_id_seq
    mappings:
      - target_field: dataset_name
        type: string
        nullable: true
        transform:
          type: generated
          field: dataset_name
      - target_field: data_type_id
        type: integer
        nullable: true
        transform:
          type: generated
          field: data_type_id
      - target_field: method_id
        type: integer
        nullable: true
        transform:
          type: generated
          field: method_id
      - target_field: master_set_id
        type: integer
        nullable: true
        transform:
          type: generated
          field: master_set_id
    reconciliation:
      existing_rows:
        table: tbl_datasets
        where: "dataset_id = :dataset_id"
        bind:
          dataset_id: "generated.dataset_id"
      compare_fields: [dataset_name, data_type_id, method_id, master_set_id]
      on_missing_generated: insert
      on_missing_existing: keep
      on_match: update
      comment: BaseRelativeDateUpdater mutates the dataset already attached to a traced RelativeDate in place; new RelativeDate rows create a fresh dataset and rely on JPA cascade persistence rather than repository lookup.
    update_detection:
      strategy: field_comparison
      fields:
        - dataset_name
        - data_type_id
        - method_id
        - master_set_id
      on_change: mark_updated
    comment: Dataset creation uses the fixed Uncalibrated dates data type, the relative-date method manager result, the retained PeriodDateCODE, and the Bugs master set.
  - name: analysis_entity
    table: tbl_analysis_entities
    mode: zero_or_one
    relationship: supporting
    item_helper: generate_period_analysis_entity_items
    persistence: cascade
    key_fields: [analysis_entity_id, physical_sample_id, dataset_id]
    identity:
      column: analysis_entity_id
      type: integer
      strategy: sequence
      sequence: tbl_analysis_entities_analysis_entity_id_seq
    mappings:
      - target_field: physical_sample_id
        type: integer
        nullable: false
        transform:
          type: generated
          field: physical_sample_id
      - target_field: dataset_id
        type: integer
        nullable: true
        transform:
          type: generated
          field: dataset_id
    reconciliation:
      existing_rows:
        table: tbl_analysis_entities
        where: "analysis_entity_id = :analysis_entity_id"
        bind:
          analysis_entity_id: "generated.analysis_entity_id"
      compare_fields: [physical_sample_id, dataset_id]
      on_missing_generated: insert
      on_missing_existing: keep
      on_match: update
      comment: Traced RelativeDate rows reuse and update their attached analysis entity; new RelativeDate rows create a fresh analysis entity tied to the traced sample and generated dataset.
    update_detection:
      strategy: field_comparison
      fields:
        - physical_sample_id
        - dataset_id
      on_change: mark_updated
    comment: AnalysisEntity rows are created or mutated through the persisted RelativeDate graph and are not repository-matched in this importer.

mappings:
  - target_field: notes
    type: string
    nullable: true
    source_field: Notes
  - target_field: relative_age_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_relative_age_id
      args: ["source.PeriodCODE"]
  - target_field: dating_uncertainty_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_dating_uncertainty_id
      args: ["source.Uncertainty"]
  - target_field: analysis_entity_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_relative_date_analysis_entity_id
      args: ["source.SampleCODE", "source.DatingMethod", "source.PeriodDateCODE", "source.PeriodCODE"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: trace_lookup
      order: 1
      type: trace_lookup
      description: Look up the existing relative-date row by PeriodDateCODE from bugs_trace.
      bugs_table: TDatesPeriod
      identifier_expr: "source.PeriodDateCODE"
      on_match: update
      on_error: skip
    - name: create_new
      order: 2
      type: create_new
      description: No trace match found; create a new period-based relative-date row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - notes
    - relative_age_id
    - dating_uncertainty_id
    - analysis_entity_id
  on_change: mark_updated
  comment: The direct row update is on tbl_relative_dates, while dataset and analysis-entity changes flow through the same persisted graph.

dependencies: [Period, Sample]

tracing:
  bugs_table: TDatesPeriod
  sead_table: tbl_relative_dates
  write_on: [insert, update]

known_divergences:
  - area: created_supporting_rows_mark_updated
    status: behavior_ambiguous
    description: Current relative-date updater create paths can still surface supporting dataset rows as updated=true. Fixtures now carry explicit supporting_action values and preserve updated=true only as parity evidence.
    policy_choice: match_intended_behavior

resolvers:
  - name: resolve_relative_date_method
    description: Resolve the dating method used for the period-based relative-date dataset through blank fallback, direct abbreviation lookup, then a period-years-type suffix.
    returns: entity_ref
    args: [dating_method, period_years_type]
    config:
      - name: default_unknown_cal_method
        property: relative.date.default.unknown.cal.method
        default: UnknownCal
        description: Default method abbreviation when the Bugs dating method is blank.
    steps:
      - name: empty_default
        when: "dating_method is None or dating_method.strip() == ''"
        action: database_query
        table: tbl_methods
        where: "method_abbrev_or_alt_name = :method_abbreviation"
        bind:
          method_abbreviation: "config.default_unknown_cal_method"
        return: return_entity
      - name: direct_lookup
        action: database_query
        table: tbl_methods
        where: "method_abbrev_or_alt_name = :method_abbreviation"
        bind:
          method_abbreviation: "dating_method"
        return: return_entity
      - name: computed_from_period_year_type
        action: database_query
        table: tbl_methods
        where: "method_abbrev_or_alt_name = :method_abbreviation"
        bind:
          method_abbreviation: "dating_method + suffix(period_years_type)"
        return: return_entity
      - name: not_found
        action: emit_issue
        emit:
          severity: error
          code: relative_date_method_not_found
          message: No dating method found
        return: empty_entity
    used_by: [analysis_entity_id]

helpers:
  - name: resolve_relative_age_id
    description: Resolve PeriodCODE through PeriodTraceHelper to tbl_relative_ages.relative_age_id.
    signature: "resolve_relative_age_id(period_code: str | None) -> int | None"
    used_by: [relative_age_id]
  - name: resolve_dating_uncertainty_id
    description: Resolve a non-blank uncertainty symbol to tbl_dating_uncertainty.dating_uncertainty_id.
    signature: "resolve_dating_uncertainty_id(uncertainty: str | None) -> int | None"
    used_by: [dating_uncertainty_id]
  - name: resolve_relative_date_analysis_entity_id
    description: Resolve or create the AnalysisEntity and Dataset for this relative date using the traced sample, Bugs master set, fixed Uncalibrated dates data type, and the relative-date method manager.
    signature: "resolve_relative_date_analysis_entity_id(sample_code: str | None, dating_method: str | None, dates_id: str | None, period_code: str | None) -> int | None"
    used_by: [analysis_entity_id]
  - name: generate_period_dataset_items
    description: Emit the dataset attached to the persisted RelativeDate row, preserving the traced dataset_id for updates and using PeriodDateCODE as the dataset name with the fixed Uncalibrated dates data type.
    signature: "generate_period_dataset_items(sample_code: str | None, period_date_code: str | None, dating_method: str | None, period_code: str | None) -> list[PeriodDatasetItem]"
    expression: "[{'dataset_id': ..., 'dataset_name': ..., 'data_type_id': ..., 'method_id': ..., 'master_set_id': ...}]"
  - name: generate_period_analysis_entity_items
    description: Emit the analysis entity attached to the persisted RelativeDate row, preserving the traced analysis_entity_id for updates and linking the traced sample to the generated dataset.
    signature: "generate_period_analysis_entity_items(sample_code: str | None, period_date_code: str | None, dating_method: str | None) -> list[PeriodAnalysisEntityItem]"
    expression: "[{'analysis_entity_id': ..., 'physical_sample_id': ..., 'dataset_id': ...}]"
