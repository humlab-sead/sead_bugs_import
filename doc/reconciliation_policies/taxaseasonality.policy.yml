# BugsCEP → SEAD Reconciliation Policy
# Domain: TaxaSeasonality (TTaxaSeasonality → tbl_taxa_seasonality)

meta:
  format_version: "1.0"
  generated_from: java_source
  reviewed: false
  notes: >
    TaxaSeasonalityImporter uses an ordered search chain: trace lookup by the
    formatted seasonality trace key, a history-conflict guard that returns an
    error carrier when previously imported rows were edited, then an exact
    repository lookup by location, fixed adult-active type, species, and season.
    Converted 2026-06-20: resolved resolve_adult_active_type_id, resolve_season_id,
    resolve_taxon_id, and resolve_location_id helpers to structured resolvers.
    Added known_divergences for history conflict detection and trace-based
    resolution being adapter-only.

policy:
  domain: taxaseasonality
  description: >
    Imports taxon seasonality rows from TTaxaSeasonality into
    tbl_taxa_seasonality. Existing rows are found through the ordered
    TaxaSeasonalitySearch chain; if no match exists the importer creates a new
    row with resolved activity, season, taxon, and location IDs.

source:
  system: bugscep
  table: TSeasonActiveAdult
  sql: "SELECT CODE, HSeason, CountryCode FROM TSeasonActiveAdult"
  fields:
    - name: CODE
      type: decimal
      nullable: true
      role: natural_key
      comment: Species code used in both trace history and repository lookup.
    - name: HSeason
      type: string
      nullable: true
      role: data
    - name: CountryCode
      type: string
      nullable: true
      role: data
  identity_key: CODE
  trace_key:
    template: "{format_7dp(CODE)}{HSeason}{CountryCode}"
    comment: compressToString() formats CODE with 7 decimal places before concatenating HSeason and CountryCode.

target:
  system: sead
  table: tbl_taxa_seasonality
  identity:
    column: seasonality_id
    type: integer
    strategy: sequence
    sequence: tbl_taxa_seasonality_seasonality_id_seq

mappings:
  - target_field: activity_type_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_adult_active_type_id
      args: []
  - target_field: season_id
    type: integer
    nullable: true
    transform:
      type: call
      helper: resolve_season_id
      args: ["source.HSeason"]
  - target_field: taxon_id
    type: integer
    nullable: false
    transform:
      type: call
      helper: resolve_taxon_id
      args: ["source.CODE"]
  - target_field: location_id
    type: integer
    nullable: false
    transform:
      type: call
      helper: resolve_location_id
      args: ["source.CountryCode"]

reconciliation:
  strategy: ordered_rules
  rules:
    - name: seasonality_search_chain
      order: 1
      type: search_chain
      description: >
        Apply the ordered TaxaSeasonality search rules and take the first match
        or error carrier.
      steps:
        - name: trace_lookup
          order: 1
          type: trace_lookup
          description: Check the last trace row using the formatted seasonality trace key.
          bugs_table: TSeasonActiveAdult
          identifier_expr: "format_7dp(source.CODE) + source.HSeason + source.CountryCode"
          on_match: update
          on_error: skip
        - name: updated_since_last_import_guard
          order: 2
          type: history_check
          description: Return an error carrier if an earlier imported seasonality for this species was edited after the latest trace.
          match_condition: "latest bugs_trace exists for source.CODE and any existing seasonality for resolve_taxon_id(source.CODE) was edited after that trace"
          on_match: return_as_is
          comment: Mirrors CheckTaxaSeasonalityHistoryRule, which blocks further processing on external edits.
        - name: repository_lookup
          order: 3
          type: database_query
          description: Find an existing seasonality row by location, fixed adult-active type, species, and season.
          table: tbl_taxa_seasonality
          where: "location_id = :location_id AND activity_type_id = :activity_type_id AND taxon_id = :taxon_id AND season_id = :season_id"
          bind:
            location_id: "resolve_location_id(source.CountryCode)"
            activity_type_id: "resolve_adult_active_type_id()"
            taxon_id: "resolve_taxon_id(source.CODE)"
            season_id: "resolve_season_id(source.HSeason)"
          on_match: update
      on_no_match: fall_through
    - name: create_new
      order: 2
      type: create_new
      description: No search rule matched; create a new taxa-seasonality row.
      on_match: insert

update_detection:
  strategy: field_comparison
  fields:
    - activity_type_id
    - season_id
    - taxon_id
    - location_id
  on_change: mark_updated

dependencies: [Country, Index]

tracing:
  bugs_table: TSeasonActiveAdult
  sead_table: tbl_taxa_seasonality
  write_on: [insert, update]

# ── KNOWN DIVERGENCES ────────────────────────────────────────────────────────

known_divergences:
  - area: history_conflict_detection_adapter
    status: schema_limit
    description: The importer checks if any seasonality row for the species was edited after the latest trace for this Bugs code. If so, an error carrier is returned. This history conflict detection is adapter-only behavior that compares trace timestamps with SEAD row modification times.
    policy_choice: match_java_runtime
  - area: trace_based_resolution_adapter
    status: schema_limit
    description: All four foreign keys (adult active type, season, taxon, location) are resolved via trace lookups and database queries against previously imported rows. The actual trace helpers and repository chains are adapter-only behavior.
    policy_choice: match_java_runtime

# ── RESOLVERS ────────────────────────────────────────────────────────────────

resolvers:
  - name: resolve_adult_active_type_id
    description: Return the fixed adult-active type row from tbl_activity_types.
    returns: scalar
    args: []
    steps:
      - name: database_query
        action: database_query
        table: tbl_activity_types
        where: "type_name = :type_name"
        bind:
          type_name: "Adult active"
        return: return_entity
        comment: Fixed lookup for the 'Adult active' activity type.
    used_by: [activity_type_id]
  - name: resolve_season_id
    description: Resolve the Bugs season value to tbl_seasons.season_id using case-insensitive name matching.
    returns: scalar
    args: ["source.HSeason"]
    steps:
      - name: database_query
        action: database_query
        table: tbl_seasons
        where: "LOWER(season_name) = LOWER(:season_name)"
        bind:
          season_name: "source.HSeason"
        return: return_entity
        comment: SeasonRepository.findByNameIgnoreCase performs case-insensitive lookup.
    used_by: [season_id]
  - name: resolve_taxon_id
    description: Resolve the Bugs species code to tbl_taxa_tree_master.taxon_id.
    returns: scalar
    args: ["source.CODE"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TTaxa
        identifier_expr: "source.CODE"
        return: return_entity
        comment: TaxaTraceSearch looks up the latest trace for the species code.
    used_by: [taxon_id]
  - name: resolve_location_id
    description: Resolve the Bugs country code to tbl_locations.location_id for the Country location type.
    returns: scalar
    args: ["source.CountryCode"]
    steps:
      - name: trace_lookup
        action: trace_lookup
        bugs_table: TCountry
        identifier_expr: "source.CountryCode"
        return: return_entity
        comment: CountryTraceSearch looks up the latest trace for the country code.
    used_by: [location_id]

# ── HELPERS ──────────────────────────────────────────────────────────────────

helpers:
  - name: resolve_adult_active_type_id
    description: >
      Superseded by structured resolver resolve_adult_active_type_id.
      Previously returned the fixed adult-active type row from tbl_activity_types.
    signature: "resolve_adult_active_type_id() -> int | None"
    used_by: []
  - name: resolve_season_id
    description: >
      Superseded by structured resolver resolve_season_id.
      Previously resolved the Bugs season value to tbl_seasons.season_id
      using case-insensitive name matching.
    signature: "resolve_season_id(season: str | None) -> int | None"
    used_by: []
  - name: resolve_taxon_id
    description: >
      Superseded by structured resolver resolve_taxon_id.
      Previously resolved the Bugs species code to tbl_taxa_tree_master.taxon_id.
    signature: "resolve_taxon_id(code: str | None) -> int | None"
    used_by: []
  - name: resolve_location_id
    description: >
      Superseded by structured resolver resolve_location_id.
      Previously resolved the Bugs country code to tbl_locations.location_id.
    signature: "resolve_location_id(country_code: str | None) -> int | None"
    used_by: []